name: ETL tipos de cambio (intradia)

# Corre solamente los fetchers de tipo de cambio: dólar oficial (BCRA),
# dólares alternativos (argentinadatos) y monedas LATAM (BCRA).
# Resto del ETL (inflación, EMAE, PBI, empleo, pobreza) queda para el cron
# diario `etl-daily.yml` ya que esas series no cambian intradia.
#
# Costo: $0 — GitHub Actions es ilimitado en repos públicos.

on:
  schedule:
    # Cada 2 horas entre 13 y 22 UTC (= 10:00 a 19:00 hora Buenos Aires UTC-3).
    # Cubre el horario de operatoria cambiaria. Fuera de eso, los dólares no
    # se mueven en las fuentes públicas.
    - cron: "0 13,15,17,19,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etl-fx:
    name: Refresh FX
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estadisticapp
          POSTGRES_PASSWORD: estadisticapp
          POSTGRES_DB: estadisticapp
          TZ: America/Argentina/Buenos_Aires
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estadisticapp -d estadisticapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: estadisticapp
      PGUSER: estadisticapp
      PGPASSWORD: estadisticapp
      ETL_EXPORT_JSON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.ETL_PUSH_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: etl/requirements.txt

      - name: Install Python dependencies
        run: pip install -r etl/requirements.txt

      - name: Wait for Postgres ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U estadisticapp -d estadisticapp; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Initialize schema
        run: python etl/init_db.py

      - name: Run FX fetchers
        run: |
          python etl/fetch_dolar.py
          python etl/fetch_dolares_alt.py
          python etl/fetch_monedas_latam.py
          python etl/fetch_mercado.py
          # Log intradía (compra/venta del día, dedup-on-change). No usa Postgres.
          python etl/fetch_dolar_intradia.py

      - name: Generate status.json
        run: python etl/generate_status.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull latest before commit
        run: git pull --rebase --autostash origin main

      - name: Commit and push if changed
        run: |
          if git diff --quiet --exit-code data/; then
            echo "No hay cambios en data/. Skipping commit."
          else
            git add data/
            git commit -m "data: refresh FX intradia $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:main
          fi
