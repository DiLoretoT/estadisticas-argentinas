name: ETL tipos de cambio (intradia)

# Corre solamente los fetchers de tipo de cambio: dólar oficial (BCRA),
# dólares alternativos (argentinadatos) y monedas LATAM (BCRA).
# Resto del ETL (inflación, EMAE, PBI, empleo, pobreza) queda para el cron
# diario `etl-daily.yml` ya que esas series no cambian intradia.
#
# Costo: $0 — GitHub Actions es ilimitado en repos públicos.

on:
  schedule:
    # Cada 2 horas entre 13 y 22 UTC (= 10:00 a 19:00 hora Buenos Aires UTC-3).
    # Cubre el horario de operatoria cambiaria. Fuera de eso, los dólares no
    # se mueven en las fuentes públicas.
    - cron: "0 13,15,17,19,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Serializa contra los otros ETL: todos commitean a main y sin esto dos pushes
# simultáneos se pisan.
concurrency:
  group: etl-data-push
  cancel-in-progress: false

jobs:
  etl-fx:
    name: Refresh FX
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estadisticapp
          POSTGRES_PASSWORD: estadisticapp
          POSTGRES_DB: estadisticapp
          TZ: America/Argentina/Buenos_Aires
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estadisticapp -d estadisticapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: estadisticapp
      PGUSER: estadisticapp
      PGPASSWORD: estadisticapp
      ETL_EXPORT_JSON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GITHUB_TOKEN en vez de un PAT: GitHub lo genera por corrida y lo
          # descarta al terminar, asi que no vence. El PAT anterior murio el
          # 2026-08-30 y dejo los tres ETL fallando en el Checkout durante dos
          # dias ("could not read Username for https://github.com").
          # Alcanza con el `permissions: contents: write` declarado arriba.
          # Sus pushes no disparan otros workflows, que aca es lo deseado: los
          # commits de data/ ya estan excluidos por paths-ignore en ci.yml y
          # security.yml.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: etl/requirements.txt

      - name: Install Python dependencies
        run: pip install -r etl/requirements.txt

      - name: Wait for Postgres ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U estadisticapp -d estadisticapp; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Initialize schema
        run: python etl/init_db.py

      - name: Run FX fetchers
        run: |
          python etl/fetch_dolar.py
          python etl/fetch_dolares_alt.py
          python etl/fetch_monedas_latam.py
          python etl/fetch_mercado.py
          # El log intradía se movió a etl-intradia.yml, que corre cada 30 min.
          # Un solo workflow es dueño de data/dolar_intradia.json.

      - name: Generate status.json
        run: python etl/generate_status.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull latest before commit
        run: git pull --rebase --autostash origin main

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet --exit-code data/; then
            echo "No hay cambios en data/. Skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git add data/
            git commit -m "data: refresh FX intradia $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purgar cache de jsdelivr
        # jsdelivr cachea los URLs @main 12 h (s-maxage=43200): sin purgar, la
        # web sigue leyendo el JSON viejo aunque el commit ya esté en main.
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: git diff --name-only HEAD~1 HEAD -- data/ | python etl/purge_jsdelivr.py
