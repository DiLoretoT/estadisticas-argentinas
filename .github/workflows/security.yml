name: Security checks

on:
  push:
    branches: [main]
    # Los ETL commitean a main solos (etl-fx 5x/día hábil, etl-daily 2x/día).
    # Sin esto, cada refresh de datos re-dispara el scan completo y, si algo
    # falla, manda un mail por commit. El código no cambia en esos pushes.
    paths-ignore:
      - "data/**"
  pull_request:
    branches: [main]
  schedule:
    # Lunes 13 UTC = 10 AR
    - cron: "0 13 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Secret scan (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: GitLeaks
        # Pineado a SHA — release v2.3.7
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # CodeQL: removido de este workflow. GitHub corre el "Default setup" de
  # Code scanning (configurado vía Settings → Code security) que escanea
  # JS/TS y Python automáticamente con managed rules updated. No duplicar.
