name: ETL diario

on:
  schedule:
    # 09:00 y 23:00 UTC (06:00 y 20:00 hora Buenos Aires UTC-3)
    - cron: "0 9,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Necesario para que el ETL abra y mergee su propio PR de datos:
  # la proteccion de main no deja pushear directo salvo a admins.
  pull-requests: write

# Serializa contra los otros ETL: todos commitean a main y sin esto dos pushes
# simultáneos se pisan.
concurrency:
  group: etl-data-push
  cancel-in-progress: false

jobs:
  etl:
    name: Refresh data
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estadisticapp
          POSTGRES_PASSWORD: estadisticapp
          POSTGRES_DB: estadisticapp
          TZ: America/Argentina/Buenos_Aires
          PGTZ: America/Argentina/Buenos_Aires
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estadisticapp -d estadisticapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: estadisticapp
      PGUSER: estadisticapp
      PGPASSWORD: estadisticapp
      ETL_EXPORT_JSON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GITHUB_TOKEN en vez de un PAT: GitHub lo genera por corrida y lo
          # descarta al terminar, asi que no vence. El PAT anterior murio el
          # 2026-08-30 y dejo los tres ETL fallando en el Checkout durante dos
          # dias ("could not read Username for https://github.com").
          # No puede pushear directo a main (la proteccion exige PR y solo
          # exime a admins), asi que el commit va por .github/scripts/
          # commit-via-pr.sh: rama efimera + PR + merge, todo con este token.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: etl/requirements.txt

      - name: Install Python dependencies
        run: pip install -r etl/requirements.txt

      - name: Wait for Postgres ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U estadisticapp -d estadisticapp; then
              echo "Postgres listo"
              exit 0
            fi
            echo "Esperando Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres no respondió"
          exit 1

      - name: Initialize schema
        run: python etl/init_db.py
        working-directory: ${{ github.workspace }}

      - name: Run ETL
        run: python etl/run_all.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Generate status.json
        run: python etl/generate_status.py
        working-directory: ${{ github.workspace }}

      - name: Generate reporte.json
        run: python etl/generate_report.py
        working-directory: ${{ github.workspace }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull latest before commit
        run: git pull --rebase --autostash origin main

      - name: Commit via PR efimero
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/commit-via-pr.sh \
            "data: refresh automático $(date -u +'%Y-%m-%dT%H:%MZ')" \
            "etl/daily" \
            data/

      - name: Purgar cache de jsdelivr
        # jsdelivr cachea los URLs @main 12 h (s-maxage=43200): sin purgar, la
        # web sigue leyendo el JSON viejo aunque el commit ya esté en main.
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        # La lista la deja commit-via-pr.sh: tras el merge el checkout local
        # no refleja el squash, asi que `git diff HEAD~1 HEAD` no sirve.
        run: python etl/purge_jsdelivr.py < "$RUNNER_TEMP/changed-data-files.txt"
