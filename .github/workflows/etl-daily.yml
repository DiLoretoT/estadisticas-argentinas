name: ETL diario

on:
  schedule:
    # 09:00 y 23:00 UTC (06:00 y 20:00 hora Buenos Aires UTC-3)
    - cron: "0 9,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etl:
    name: Refresh data
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estadisticapp
          POSTGRES_PASSWORD: estadisticapp
          POSTGRES_DB: estadisticapp
          TZ: America/Argentina/Buenos_Aires
          PGTZ: America/Argentina/Buenos_Aires
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estadisticapp -d estadisticapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: estadisticapp
      PGUSER: estadisticapp
      PGPASSWORD: estadisticapp
      ETL_EXPORT_JSON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.ETL_PUSH_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: etl/requirements.txt

      - name: Install Python dependencies
        run: pip install -r etl/requirements.txt

      - name: Wait for Postgres ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U estadisticapp -d estadisticapp; then
              echo "Postgres listo"
              exit 0
            fi
            echo "Esperando Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres no respondió"
          exit 1

      - name: Initialize schema
        run: python etl/init_db.py
        working-directory: ${{ github.workspace }}

      - name: Run ETL
        run: python etl/run_all.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Generate status.json
        run: python etl/generate_status.py
        working-directory: ${{ github.workspace }}

      - name: Generate reporte.json
        run: python etl/generate_report.py
        working-directory: ${{ github.workspace }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull latest before commit
        run: git pull --rebase --autostash origin main

      - name: Commit and push if changed
        run: |
          if git diff --quiet --exit-code data/; then
            echo "No hay cambios en data/. Skipping commit."
          else
            git add data/
            git commit -m "data: refresh automático $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:main
            echo "Cambios commiteados a main."
          fi
